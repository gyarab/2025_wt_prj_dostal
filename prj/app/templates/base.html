{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'app/style.css' %}">
</head>

<body>
    <header>
        <!--Navbar-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <strong>Home</strong>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'food_database' %}">Food Database</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/api_playground">API Playground</a>
                        </li>
                    </ul>
                    <!-- Theme Switcher Icon -->
                    <button class="btn btn-link nav-link py-2 px-0 px-lg-2" type="button" id="theme-toggle">
                        <i class="bi" id="theme-toggle-icon"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container content-wrapper">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            &copy; 2026 Filip Dostál. All Rights Reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        (() => {
            'use strict'
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleIcon = document.getElementById('theme-toggle-icon');
            const htmlElement = document.documentElement;

            themeToggleIcon.classList.add('bi-moon-stars-fill');

            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-bs-theme');
                if (currentTheme === 'dark') {
                    // Switch to light mode
                    htmlElement.setAttribute('data-bs-theme', 'light');
                    themeToggleIcon.classList.remove('bi-sun-fill');
                    themeToggleIcon.classList.add('bi-moon-stars-fill');
                } else {
                    // Switch to dark mode
                    htmlElement.setAttribute('data-bs-theme', 'dark');
                    themeToggleIcon.classList.remove('bi-moon-stars-fill');
                    themeToggleIcon.classList.add('bi-sun-fill');
                }
            });
        })()
    </script>
</body>

</html>
